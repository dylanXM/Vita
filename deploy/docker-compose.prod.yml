
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: vita/api:${IMAGE_TAG:-prod}
    restart: unless-stopped
    environment:
      VITA_ENV: "${VITA_ENV:-prod}"
      VITA_HTTP_ADDR: ":8080"
      VITA_DB_DSN: "${VITA_DB_DSN:?set VITA_DB_DSN in .env.prod}"
      VITA_REDIS_URL: "${VITA_REDIS_URL:?set VITA_REDIS_URL in .env.prod}"
      VITA_JWT_SECRET: "${VITA_JWT_SECRET:?set VITA_JWT_SECRET in .env.prod}"
      VITA_MOCK_GENERATION: "${VITA_MOCK_GENERATION:-false}"
      VITA_AUTO_MIGRATE: "${VITA_AUTO_MIGRATE:-false}"
      VITA_STORAGE_PROVIDER: "${VITA_STORAGE_PROVIDER:-cos}"
      VITA_ADMIN_EMAIL: "${VITA_ADMIN_EMAIL:-}"
      VITA_ADMIN_PASSWORD: "${VITA_ADMIN_PASSWORD:-}"
      VITA_ADMIN_EMAILS: "${VITA_ADMIN_EMAILS:-}"
    ports:
      - "0.0.0.0:8270:8080"
    networks:
      - vita-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  webapp:
    build:
      context: ..
      dockerfile: webapp/Dockerfile
      args:
        VITA_API_URL: "${WEBAPP_API_URL:-http://api:8080}"
        VITA_ENV: "${WEBAPP_ENV:-prod}"
    image: vita/webapp:${IMAGE_TAG:-prod}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITA_API_URL: "${WEBAPP_API_URL:-http://api:8080}"
      VITA_ENV: "${WEBAPP_ENV:-prod}"
    ports:
      - "${WEBAPP_BIND_HOST:-127.0.0.1}:${WEBAPP_PORT:-8263}:3000"
    networks:
      - vita-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    scale: 1

networks:
  vita-net:
    driver: bridge
