
services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: vita/api:${IMAGE_TAG:-beta}
    restart: unless-stopped
    environment:
      VITA_ENV: "${VITA_ENV:-beta}"
      VITA_HTTP_ADDR: ":8080"
      VITA_DB_DSN: "${VITA_DB_DSN:?set VITA_DB_DSN in .env.beta}"
      VITA_REDIS_URL: "${VITA_REDIS_URL:?set VITA_REDIS_URL in .env.beta}"
      VITA_JWT_SECRET: "${VITA_JWT_SECRET:?set VITA_JWT_SECRET in .env.beta}"
      VITA_MOCK_GENERATION: "${VITA_MOCK_GENERATION:-false}"
      VITA_AUTO_MIGRATE: "${VITA_AUTO_MIGRATE:-true}"
      VITA_STORAGE_PROVIDER: "${VITA_STORAGE_PROVIDER:-cos}"
      VITA_ADMIN_EMAIL: "${VITA_ADMIN_EMAIL:-}"
      VITA_ADMIN_PASSWORD: "${VITA_ADMIN_PASSWORD:-}"
      VITA_ADMIN_EMAILS: "${VITA_ADMIN_EMAILS:-}"
      VITA_SMTP_HOST: "${VITA_SMTP_HOST:-}"
      VITA_SMTP_PORT: "${VITA_SMTP_PORT:-465}"
      VITA_SMTP_USERNAME: "${VITA_SMTP_USERNAME:-}"
      VITA_SMTP_PASSWORD: "${VITA_SMTP_PASSWORD:-}"
      VITA_SMTP_FROM: "${VITA_SMTP_FROM:-}"
      VITA_SMTP_FROM_NAME: "${VITA_SMTP_FROM_NAME:-Vita}"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${SERVER_PORT:-8260}:8080"
    networks:
      - vita-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    image: vita/admin:${IMAGE_TAG:-beta}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ADMIN_BIND_HOST:-127.0.0.1}:${ADMIN_PORT:-8261}:80"
    networks:
      - vita-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  webapp:
    build:
      context: ..
      dockerfile: webapp/Dockerfile
      args:
        VITA_API_URL: "${WEBAPP_API_URL:-http://api:8080}"
        VITA_ENV: "${WEBAPP_ENV:-staging}"
    image: vita/webapp:${IMAGE_TAG:-beta}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITA_API_URL: "${WEBAPP_API_URL:-http://api:8080}"
      VITA_ENV: "${WEBAPP_ENV:-staging}"
    ports:
      - "${WEBAPP_BIND_HOST:-127.0.0.1}:${WEBAPP_PORT:-8263}:3000"
    networks:
      - vita-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  vita-net:
    driver: bridge
