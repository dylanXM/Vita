name: vita
description: "AI Companion mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  in_app_purchase: 3.2.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.3.1
  json_annotation: ^4.9.0
  google_sign_in: ^6.2.1
  purchases_flutter: ^10.13.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/companions/
    - assets/icons/
    - assets/ai_pets/
